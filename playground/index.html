<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeScript 0.1 Playground</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --panel-bg: #070b13;
      --border: #1f293d;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --cyan: #22d3ee;
      --cyan-hover: #38bdf8;
      --green: #4ade80;
      --red: #f87171;
      --amber: #fbbf24;
      --btn-bg: #1e293b;
      --btn-hover: #334155;
    }

    * { box-sizing: border-box; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 12px 24px;
      background: #0d1322;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      font-size: 1.15rem;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(34, 211, 238, 0.15);
      color: var(--cyan);
      font-weight: 600;
      border: 1px solid rgba(34, 211, 238, 0.3);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    select, button {
      background: var(--btn-bg);
      color: var(--text);
      border: 1px solid #334155;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.15s ease-in-out;
    }

    select:hover, button:hover {
      background: var(--btn-hover);
      border-color: #475569;
    }

    button.primary {
      background: #0284c7;
      border-color: #0369a1;
      color: #fff;
    }

    button.primary:hover {
      background: #0369a1;
    }

    button.accent {
      background: #059669;
      border-color: #047857;
      color: #fff;
    }

    button.accent:hover {
      background: #047857;
    }

    .nav-links {
      display: flex;
      gap: 14px;
      font-size: 0.85rem;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    .nav-links a:hover {
      color: var(--cyan);
    }

    main {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      flex: 1;
      min-height: 0;
    }

    .editor-pane, .output-pane {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      position: relative;
    }

    .pane-header {
      padding: 8px 16px;
      background: #0a0e1a;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .editor-pane {
      border-right: 1px solid var(--border);
    }

    textarea, pre {
      margin: 0;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13.5px;
      line-height: 1.55;
      border: 0;
      flex: 1;
      min-height: 0;
      overflow: auto;
      outline: none;
    }

    textarea {
      background: var(--panel-bg);
      color: #f1f5f9;
      resize: none;
      width: 100%;
      tab-size: 4;
    }

    pre {
      background: #0c101c;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ok { color: var(--green); }
    .err { color: var(--red); }
    .note { color: var(--muted); }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      background: var(--muted);
    }
    .status-dot.green { background: var(--green); }
    .status-dot.red { background: var(--red); }

    footer {
      padding: 6px 20px;
      background: #070a12;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer code {
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--cyan);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>VibeScript</h1>
      <span class="badge">vibe-0.1</span>
    </div>

    <div class="controls">
      <label for="sample" style="font-size: 0.85rem; color: var(--muted);">Sample:</label>
      <select id="sample"></select>
      <button type="button" id="check">Diagnose (Check)</button>
      <button type="button" id="eval" class="primary">Eval (Run)</button>
      <button type="button" id="format" class="accent">Format</button>
    </div>

    <div class="nav-links">
      <a href="/docs/showcase.html">Showcase</a>
      <a href="/docs/spec.html">Spec</a>
      <a href="/docs/honesty.html">Honesty</a>
      <a href="/docs/dev-docs.html">API Scan</a>
      <a href="/skills/SKILL.md">Agent Skill</a>
      <a href="/docs/index.html">Docs</a>
    </div>
  </header>

  <main>
    <div class="editor-pane">
      <div class="pane-header">
        <span>Source Code (.vibe)</span>
        <span id="char-count" class="note">0 chars</span>
      </div>
      <textarea id="src" spellcheck="false"></textarea>
    </div>

    <div class="output-pane">
      <div class="pane-header">
        <div><span id="status-dot" class="status-dot"></span><span id="pane-title">Output</span></div>
        <span id="response-time" class="note"></span>
      </div>
      <pre id="out" class="note">Select a sample or type code, then click Check, Eval, or Format.</pre>
    </div>
  </main>

  <footer>
    <span>vibe-0.1 current dialect &middot; vibe-wasm 0.0.38 &middot; grammar may grow when versioned</span>
    <span>Host CLI: <code>cargo run -p vibe-play</code></span>
  </footer>

  <script type="module">
    import initWasm, {
      language_version,
      eval_program_src,
      eval_cell_src,
      diagnose_src,
      project_source
    } from "../docs/pkg/vibe/vibe_wasm.js";

    let wasmReady = false;

    async function initEngine() {
      try {
        await initWasm();
        wasmReady = true;
        statusDot.className = "status-dot green";
        out.textContent = `✓ Client-side WebAssembly Engine (VibeScript ${language_version()}) loaded and ready.`;
        out.className = "ok";
      } catch (err) {
        console.warn("WASM load failed, will use API fallback:", err);
      }
    }

    const samples = {
      linear_algebra: `// Works here: LinearAlgebra.dot on this page.
using LinearAlgebra;

effect fn main() {
    return LinearAlgebra.dot({ a: [1.0, 2.0, 3.0], b: [4.0, 5.0, 6.0] });
}`,
      reactive_cells: `// Reactive-style numbers (works here)
pure fn main() {
    let a = 42;
    let b = a * 2 + 10;
    let clamped = math.min(100, math.max(0, b));
    return { a: a, b: b, clamped: clamped };
}`,
      deontic: `// Works here — term eval. Never stamps Active. A chatbot is a tool.
using DeonticLogic;

pure fn main() {
    return obligate { "did:q42:agent_must_sign" };
}`,
      vector_math: `using LinearAlgebra;

effect fn main() {
    return LinearAlgebra.norm({ a: [3.0, 4.0] });
}`,
      orbit: `using Animation;

effect fn run(t: f64) -> Record {
    return Animation.orbit_spin(t);
}

fn main() {
    return run(1.0);
}`,
      zh: `locale zh;

函数 f() -> i64 {
    返回 42;
}

函数 main() -> i64 {
    返回 f();
}`
    };

    const sel = document.getElementById("sample");
    const src = document.getElementById("src");
    const out = document.getElementById("out");
    const charCount = document.getElementById("char-count");
    const statusDot = document.getElementById("status-dot");
    const resTime = document.getElementById("response-time");

    Object.keys(samples).forEach((k) => {
      const o = document.createElement("option");
      o.value = k;
      o.textContent = k;
      sel.appendChild(o);
    });

    function updateCharCount() {
      charCount.textContent = src.value.length + " chars";
    }

    function load() {
      src.value = samples[sel.value];
      updateCharCount();
    }
    sel.addEventListener("change", load);
    src.addEventListener("input", updateCharCount);
    load();

    async function runAction(action, updateEditorOnOk = false) {
      out.className = "note";
      out.textContent = "Processing...";
      statusDot.className = "status-dot";
      const start = performance.now();
      const code = src.value.trim();

      if (wasmReady) {
        try {
          let json;
          if (action === "diagnose") {
            json = diagnose_src(code);
          } else if (action === "format") {
            const projected = project_source(code);
            json = projected.ok && projected.source
              ? { ok: true, formatted: projected.source }
              : projected;
          } else {
            json = code.startsWith("=") ? eval_cell_src(code) : eval_program_src(code);
          }

          const elapsed = (performance.now() - start).toFixed(2);
          resTime.textContent = `${elapsed} ms (WASM)`;

          if (json.ok) {
            out.className = "ok";
            statusDot.className = "status-dot green";
            if (updateEditorOnOk && json.formatted) {
              src.value = json.formatted;
              updateCharCount();
              out.textContent = "✓ Formatted successfully\n\n" + JSON.stringify(json, null, 2);
            } else {
              out.textContent = JSON.stringify(json, null, 2);
            }
          } else {
            out.className = "err";
            statusDot.className = "status-dot red";
            out.textContent = JSON.stringify(json, null, 2);
          }
          return;
        } catch (wasmErr) {
          console.warn("WASM run error, falling back to API:", wasmErr);
        }
      }

      // Fallback to local HTTP server API
      try {
        const res = await fetch(`/api/${action}`, {
          method: "POST",
          headers: { "Content-Type": "text/plain; charset=utf-8" },
          body: src.value
        });
        const elapsed = (performance.now() - start).toFixed(1);
        resTime.textContent = `${elapsed} ms (HTTP)`;

        const json = await res.json();
        if (json.ok) {
          out.className = "ok";
          statusDot.className = "status-dot green";
          if (updateEditorOnOk && json.formatted) {
            src.value = json.formatted;
            updateCharCount();
            out.textContent = "✓ Formatted successfully\n\n" + JSON.stringify(json, null, 2);
          } else {
            out.textContent = JSON.stringify(json, null, 2);
          }
        } else {
          out.className = "err";
          statusDot.className = "status-dot red";
          out.textContent = JSON.stringify(json, null, 2);
        }
      } catch (e) {
        statusDot.className = "status-dot red";
        out.className = "err";
        out.textContent = "Eval error: " + e;
      }
    }

    document.getElementById("check").addEventListener("click", () => runAction("diagnose"));
    document.getElementById("eval").addEventListener("click", () => runAction("eval"));
    document.getElementById("format").addEventListener("click", () => runAction("format", true));

    initEngine();
  </script>
</body>
</html>
