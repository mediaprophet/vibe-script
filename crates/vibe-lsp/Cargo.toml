[package]
name = "vibe-lsp"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
description = "LSP server for VibeScript 0.1 (workshop dialect)"

[dependencies]
vibe = { git = "https://github.com/mediaprophet/qualiaDB.git", branch = "0.0.40.12-etalon-migration" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "vibe-lsp"
path = "src/main.rs"
