[package]
name = "vibe-docs"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Generate docs/dev-docs.json from QualiaDB crates/vibe rustdoc comments"

[[bin]]
name = "vibe-docs"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
