<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vibe API scan</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: #0f172a; color: #e2e8f0; }
    input { width: 100%; padding: 8px; background: #1e293b; color: #e2e8f0; border: 1px solid #475569; border-radius: 6px; }
    article { margin: 1rem 0; padding: 0.75rem; background: #111827; border-radius: 8px; }
    .sig { font-family: ui-monospace, monospace; font-size: 0.85rem; color: #94a3b8; }
    a { color: #22d3ee; }
  </style>
</head>
<body>
  <p><a href="index.html">← tools</a></p>
  <h1>Engine API scan</h1>
  <p>Generated by <code>cargo run -p vibe-docs</code> from QualiaDB <code>crates/vibe</code>.</p>
  <input id="q" placeholder="filter…">
  <div id="list">Loading docs/dev-docs.json …</div>
  <script>
    const list = document.getElementById("list");
    fetch("dev-docs.json").then(r => r.json()).then(mods => {
      window.MODS = mods;
      render("");
    }).catch(() => {
      list.textContent = "Run: cargo run -p vibe-docs -- docs/dev-docs.json";
    });
    document.getElementById("q").addEventListener("input", (e) => render(e.target.value.toLowerCase()));
    function render(q) {
      if (!window.MODS) return;
      list.innerHTML = "";
      window.MODS.forEach(m => {
        (m.items || []).forEach(it => {
          const blob = (m.name + " " + it.name + " " + it.kind + " " + (it.doc || "")).toLowerCase();
          if (q && !blob.includes(q)) return;
          const el = document.createElement("article");
          el.innerHTML = "<strong>" + it.kind + " " + it.name + "</strong> <span class='sig'>" + (m.name || "") + "</span><pre class='sig'>" + (it.signature || "") + "</pre>";
          list.appendChild(el);
        });
      });
    }
  </script>
</body>
</html>
