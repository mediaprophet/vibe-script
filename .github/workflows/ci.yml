name: ci
on:
  push:
  pull_request:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: vibe-script
      - name: Read immutable engine source candidate
        id: engine
        shell: pwsh
        working-directory: vibe-script
        run: |
          $lock = Get-Content tools/ci/engine-source.json -Raw | ConvertFrom-Json
          if ($lock.revision -notmatch '^[0-9a-f]{40}$') { throw 'Full engine commit required' }
          "revision=$($lock.revision)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v5
        with:
          repository: mediaprophet/qualiaDB
          ref: ${{ steps.engine.outputs.revision }}
          path: qualia-27062026
      - name: Verify committed engine sources (missing sources fail)
        shell: pwsh
        working-directory: vibe-script
        run: ./tools/ci/verify-engine.ps1 -EngineRoot ../qualia-27062026
      - uses: dtolnay/rust-toolchain@stable
      - name: Test tooling workspace
        shell: pwsh
        working-directory: vibe-script
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_TARGET_DIR: ${{ github.workspace }}/vibe-script/target/vs03-ci
        run: |
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
