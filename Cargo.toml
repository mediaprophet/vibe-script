[workspace]
members = ["crates/vibescript-abi", "crates/vibe-lsp", "crates/vibe-play", "crates/vibe-docs", "crates/vibe-tooling"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license-file = "LICENSE"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
repository = "https://github.com/mediaprophet/vibe-script"

# Language engine is QualiaDB `crates/vibe`. Do not fork it here.
# Workspace version stays 0.0.1 — catalog alignment is not a crate bump.

[patch."https://github.com/mediaprophet/vibe-script.git"]
vibescript-abi = { path = "crates/vibescript-abi" }
